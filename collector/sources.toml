# Source configuration for the collector.
#
# Each [[source]] block configures one forum. `adapter` selects the module in
# collector/adapters/. Add a new forum by adding a block here (and, if the
# forum software is not yet supported, a new adapter). See README.md.
#
# Politeness settings (applied per host):
#   min_interval   - minimum seconds between two requests to the same host
#   max_requests   - hard cap on requests per collector run for this source
#   backfill_pages - listing pages to walk per run for the historical backfill
#   top_pages      - pages of the forum's own "most replies"/"most views" sort
#                    to refresh (every `top_refresh_hours`)

[defaults]
user_agent = "VintageForumReader/0.1 (+https://github.com/egosashimi/fashion-forum-reader; metadata indexer, polite)"
min_interval = 3.0
max_requests = 60
timeout = 30
backfill_pages = 12
top_pages = 3
top_refresh_hours = 72
# cap on leaderboard-sort requests per run (the refresh resumes next run)
top_requests_per_run = 12
posts_pages_per_run = 6
# Excerpts are cut to this many characters (sites permit search indexes with
# short excerpts via their robots.txt content signals).
excerpt_chars = 280

[[source]]
id = "fedoralounge"
name = "The Fedora Lounge"
short = "Fedora Lounge"
adapter = "xenforo"
base_url = "https://www.thefedoralounge.com"
homepage = "https://www.thefedoralounge.com/forums/outerwear-and-workwear.4/"
color = "#8a5a2b"
nodes = [
  { path = "outerwear-and-workwear.4", name = "Outerwear and Workwear" },
]

[[source]]
id = "superfuture"
name = "Superfuture — Superdenim"
short = "Superfuture"
adapter = "invision"
base_url = "https://supertalk.superfuture.com"
homepage = "https://supertalk.superfuture.com/forum/22-superdenim/"
color = "#2b5a8a"
nodes = [
  { path = "22-superdenim", name = "Superdenim" },
]
notes = "Guest-visible pages only. Supertalk says it is currently free to view for guests; since 1 Feb 2026 full access to all sections needs a paid supermember account. The site is behind Cloudflare: when it challenges automated clients the collector marks the source blocked for that run and never tries to get around it."

